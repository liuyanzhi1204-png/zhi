<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《星空救赎》前传</title>
<style>
  :root {
    --bg-top: #060d24;
    --bg-mid: #030812;
    --bg-bot: #01030a;
    --text-main: #e8ecff;
    --text-dim: rgba(232, 236, 255, 0.16);
    --gold: #ffd98a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(ellipse 80% 55% at 50% 18%, var(--bg-top) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bot) 100%);
    color: var(--text-main);
    font-family: "Songti SC", "STSongti-SC", "STSong", "Noto Serif SC", "SimSun", serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* ============ 黑场渐亮 ============ */
  .blackout {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: #000;
    opacity: 1;
    transition: opacity 4s ease;
    pointer-events: none;
  }
  .blackout.lift { opacity: 0; }

  /* ============ 底层：深空星云慢流动 ============ */
  .nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .nebula span {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    animation: nebula-drift var(--dur, 100s) ease-in-out infinite alternate;
  }
  @keyframes nebula-drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to { transform: translate3d(var(--dx, 80px), var(--dy, -60px), 0) scale(1.2); }
  }

  /* ============ 中层：零星星点呼吸闪烁 ============ */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.25;
    transition: opacity 4s ease;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation:
      twinkle var(--tw, 5s) ease-in-out infinite,
      star-drift var(--sd, 28s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.06; }
    50% { opacity: var(--peak, 0.35); }
  }
  @keyframes star-drift {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(var(--sdx, 8px), var(--sdy, -6px), 0); }
  }

  /* ============ 第一镜 / 第二镜：校园夜景 ============ */
  .campus {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    filter: blur(1.6px) saturate(0.85);
    transition: opacity 3.6s ease;
  }
  .campus.on { opacity: 0.85; }
  .campus.gone { opacity: 0; transition: opacity 1.1s ease; }
  .campus-inner {
    position: absolute;
    inset: 0;
    transform-origin: 68% 76%;
    will-change: transform, filter;
  }
  .campus.push .campus-inner {
    transform: scale(1.07);
    transition: transform 18s linear;
  }
  /* 情绪下沉：轻微失焦呼吸 */
  .campus.storm .campus-inner { animation: defocus 7.5s ease-in-out infinite; }
  @keyframes defocus {
    0%, 100% { filter: blur(0px); }
    50% { filter: blur(3px); }
  }

  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 32vh;
    background: linear-gradient(180deg, transparent 0%, rgba(2, 5, 12, 0.5) 42%, rgba(2, 4, 10, 0.94) 100%);
  }

  .school {
    position: absolute;
    right: 3%;
    bottom: 23%;
    width: clamp(150px, 24vw, 330px);
    height: clamp(80px, 13vw, 175px);
    background: linear-gradient(180deg, #050a17, #03060f);
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(120, 150, 220, 0.06);
  }
  .win-grid {
    position: absolute;
    inset: 14% 9%;
    background-image:
      repeating-linear-gradient(90deg, rgba(150, 180, 255, 0.055) 0 8px, transparent 8px 22px),
      repeating-linear-gradient(180deg, rgba(150, 180, 255, 0.045) 0 7px, transparent 7px 20px);
  }
  /* 远处教室还留着一盏灯 */
  .win-lit {
    position: absolute;
    left: 28%;
    top: 24%;
    width: 15%;
    height: 22%;
    background: linear-gradient(180deg, #ffe6b0, #ffcf7d);
    box-shadow:
      0 0 14px 3px rgba(255, 205, 120, 0.55),
      0 0 46px 12px rgba(255, 190, 100, 0.18);
    transition: opacity 1.4s ease, box-shadow 1.4s ease;
  }
  .win-lit.out { opacity: 0; box-shadow: none; }
  /* 星光倒映在窗玻璃上 */
  .win-lit i {
    position: absolute;
    width: 1.6px; height: 1.6px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.2;
    animation: twinkle 6s ease-in-out infinite;
  }
  .win-lit i:nth-child(1) { left: 22%; top: 30%; animation-delay: -1.2s; }
  .win-lit i:nth-child(2) { left: 58%; top: 22%; animation-delay: -3.4s; }
  .win-lit i:nth-child(3) { left: 40%; top: 64%; animation-delay: -5.1s; }

  .lamp-group {
    position: absolute;
    right: 31%;
    bottom: 21%;
    transition: opacity 2s ease;
  }
  .lamp-group.out { opacity: 0; }
  .lamp-group.dying { animation: lamp-die 1.15s steps(1, end) 1; }
  @keyframes lamp-die {
    0%, 24% { opacity: 1; }
    25%, 38% { opacity: 0.22; }
    39%, 58% { opacity: 1; }
    59%, 68% { opacity: 0.08; }
    69%, 100% { opacity: 1; }
  }
  .lamp {
    position: relative;
    width: 2px;
    height: clamp(90px, 14vw, 180px);
    background: linear-gradient(180deg, rgba(120, 135, 175, 0.5), rgba(90, 105, 140, 0.16));
  }
  .lamp::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ffe3ad;
    box-shadow:
      0 0 10px 3px rgba(255, 215, 140, 0.8),
      0 0 34px 10px rgba(255, 190, 105, 0.28);
  }
  .lamp::after {
    content: '';
    position: absolute;
    left: 50%; top: -2px;
    transform: translate(-50%, -50%);
    width: clamp(160px, 24vw, 340px);
    height: clamp(160px, 24vw, 340px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 150, 0.16), rgba(255, 200, 120, 0.06) 45%, transparent 70%);
  }
  .lamp-pool {
    position: absolute;
    left: 50%;
    bottom: -8px;
    width: clamp(120px, 18vw, 260px);
    height: clamp(26px, 4vw, 52px);
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255, 205, 130, 0.12), transparent 70%);
  }

  .tree {
    position: absolute;
    transform-origin: 50% 96%;
    overflow: visible;
    animation: sway 8.5s ease-in-out infinite alternate;
  }
  .tree-a { right: 45%; bottom: 18.5%; width: clamp(56px, 8.5vw, 122px); }
  .tree-b { right: 15%; bottom: 16.5%; width: clamp(64px, 9.5vw, 140px); animation-delay: -2.4s; }
  .tree-c { right: 39%; bottom: 18%; width: clamp(44px, 6.5vw, 96px); animation-delay: -5.2s; }
  @keyframes sway {
    from { transform: rotate(-1.1deg); }
    to { transform: rotate(1.3deg); }
  }
  .campus.storm .tree-a { animation: sway-hard 1.25s ease-in-out infinite alternate; }
  .campus.storm .tree-b { animation: sway-hard 1.1s ease-in-out -0.4s infinite alternate; }
  .campus.storm .tree-c { animation: sway-hard 1.45s ease-in-out -0.8s infinite alternate; }
  @keyframes sway-hard {
    from { transform: rotate(-3.6deg); }
    to { transform: rotate(3.4deg); }
  }

  /* 像隔着水面回忆 */
  .water-sheen {
    position: absolute;
    inset: -10%;
    background: linear-gradient(115deg, transparent 38%, rgba(185, 210, 255, 0.055) 50%, transparent 62%);
    background-size: 260% 260%;
    mix-blend-mode: screen;
    animation: sheen 17s ease-in-out infinite alternate;
  }
  @keyframes sheen {
    from { background-position: 0% 0%; }
    to { background-position: 100% 100%; }
  }

  /* ============ 第二镜：雨与窗 ============ */
  .rain {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s ease;
  }
  .rain.on { opacity: 1; }
  .rain-fall { position: absolute; inset: -8% 0; }
  .rain-fall::before,
  .rain-fall::after {
    content: '';
    position: absolute;
    inset: 0;
    background-repeat: repeat;
  }
  .rain-fall::before {
    background-image: repeating-linear-gradient(94deg, rgba(200, 220, 255, 0.085) 0 1px, transparent 1px 11px);
    background-size: 100% 190px;
    animation: rainfall-a 0.85s linear infinite;
  }
  .rain-fall::after {
    background-image: repeating-linear-gradient(92deg, rgba(200, 220, 255, 0.05) 0 1px, transparent 1px 17px);
    background-size: 100% 260px;
    animation: rainfall-b 1.4s linear infinite;
  }
  @keyframes rainfall-a {
    from { background-position: 0 0; }
    to { background-position: -10px 190px; }
  }
  @keyframes rainfall-b {
    from { background-position: 0 0; }
    to { background-position: -7px 260px; }
  }
  .win-frame {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1px rgba(190, 210, 255, 0.05), inset 0 0 90px rgba(2, 5, 14, 0.45);
  }
  .win-frame::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 64%;
    width: 1px;
    background: linear-gradient(180deg, rgba(190, 210, 255, 0.05), rgba(190, 210, 255, 0.12), rgba(190, 210, 255, 0.05));
  }
  .win-frame::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 23%;
    height: 1px;
    background: linear-gradient(90deg, rgba(190, 210, 255, 0.05), rgba(190, 210, 255, 0.12), rgba(190, 210, 255, 0.05));
  }
  .drop {
    position: absolute;
    width: 3px;
    border-radius: 3px;
    background: linear-gradient(180deg, rgba(220, 235, 255, 0.32), rgba(200, 220, 255, 0.05));
    box-shadow: 0 1px 3px rgba(180, 210, 255, 0.25);
    animation: drip var(--dur) cubic-bezier(0.45, 0.05, 0.85, 0.5) var(--delay) infinite;
    will-change: transform;
  }
  @keyframes drip {
    0% { transform: translateY(-12vh) translateX(0); opacity: 0; }
    6% { opacity: 1; }
    38% { transform: translateY(27vh) translateX(2px); }
    52% { transform: translateY(27vh) translateX(2px); }
    64% { transform: translateY(50vh) translateX(-1px); }
    71% { transform: translateY(50vh) translateX(-1px); }
    100% { transform: translateY(112vh) translateX(1px); opacity: 0.85; }
  }

  /* ============ 暗化层：夜色压重 ============ */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(ellipse 120% 90% at 60% 40%, rgba(1, 3, 10, 0.55), rgba(0, 1, 4, 0.88) 80%);
    opacity: 0;
    transition: opacity 2.6s ease;
  }
  .veil.lv2 { opacity: 0.5; }
  .veil.lv3 { opacity: 0.62; }
  .veil.lv4 { opacity: 0.14; }
  .veil.lv5 { opacity: 0.06; }

  /* ============ 第三镜：玻璃碎裂 ============ */
  .shatter {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  /* ============ 第四～六镜：八星与星轨 ============ */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    transition: transform 9s cubic-bezier(0.32, 0.06, 0.3, 1);
  }
  .sky.advance { transform: translate(-3%, 5%) scale(1.12); }
  .orbit {
    position: absolute;
    inset: 0;
    animation: orbit-drift 30s ease-in-out infinite alternate;
  }
  @keyframes orbit-drift {
    from { transform: rotate(-0.7deg) translate(-0.5%, 0.4%); }
    to { transform: rotate(0.7deg) translate(0.5%, -0.4%); }
  }
  .star-trail {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .star-trail path { fill: none; stroke-linecap: round; }
  .star-trail .base {
    stroke: rgba(150, 185, 255, 0);
    stroke-width: 1.6;
    transition: stroke 3s ease;
  }
  .star-trail.lit .base { stroke: rgba(150, 185, 255, 0.45); }
  .star-trail .flow {
    stroke: rgba(235, 244, 255, 0.6);
    stroke-width: 2;
    opacity: 0;
    transition: opacity 2.4s ease;
    animation: flow 7s linear infinite;
    animation-play-state: paused;
  }
  .star-trail.lit .flow { opacity: 0.75; animation-play-state: running; }
  @keyframes flow {
    from { stroke-dashoffset: var(--dash, 1400px); }
    to { stroke-dashoffset: 0; }
  }

  .main-stars { position: absolute; inset: 0; }
  .main-star {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
      0 0 10px 2px rgba(255, 232, 190, 0.75),
      0 0 30px 7px rgba(150, 180, 255, 0.28);
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  .main-star.lit { opacity: 1; }
  /* 点亮瞬间的光晕环 */
  .main-star::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 1px solid rgba(235, 244, 255, 0.85);
    opacity: 0;
    transform: scale(0.3);
  }
  .main-star.lit::after { animation: star-ring 1.05s ease-out 1; }
  @keyframes star-ring {
    0% { opacity: 0.85; transform: scale(0.25); }
    100% { opacity: 0; transform: scale(3.4); }
  }
  .main-stars.resonate .main-star { animation: resonate 2.6s ease-in-out infinite; }
  @keyframes resonate {
    0%, 100% { transform: scale(1); }
    50% {
      transform: scale(1.22);
      box-shadow:
        0 0 13px 4px rgba(255, 232, 190, 0.75),
        0 0 36px 10px rgba(150, 180, 255, 0.36);
    }
  }

  /* ============ 第五镜：安全铠甲（光膜） ============ */
  .membrane {
    position: fixed;
    left: 70%;
    top: 53%;
    z-index: 7;
    pointer-events: none;
    width: clamp(230px, 36vw, 470px);
    height: clamp(230px, 36vw, 470px);
    transform: translate(-50%, -50%) scale(0.12);
    transform-origin: 50% 10%;
    opacity: 0;
    transition: opacity 1.1s ease, transform 1.9s cubic-bezier(0.16, 0.8, 0.3, 1);
  }
  .membrane.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .dome {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(165, 195, 255, 0.13), rgba(140, 175, 255, 0.05) 52%, transparent 70%);
    box-shadow: inset 0 0 46px rgba(175, 205, 255, 0.16), 0 0 60px rgba(140, 175, 255, 0.07);
  }
  .dome-rim {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(215, 235, 255, 0.55) 40deg, transparent 120deg, transparent 220deg, rgba(190, 220, 255, 0.3) 280deg, transparent 360deg);
    -webkit-mask: radial-gradient(circle, transparent 63%, #000 66%, #000 69%, transparent 72%);
    mask: radial-gradient(circle, transparent 63%, #000 66%, #000 69%, transparent 72%);
    opacity: 0.55;
    animation: rim-spin 24s linear infinite;
  }
  @keyframes rim-spin {
    to { transform: rotate(360deg); }
  }
  .membrane .micro {
    position: absolute;
    left: 50%;
    bottom: 15%;
    width: 74%;
    transform: translateX(-50%);
    opacity: 0.92;
    animation: micro-float 9s ease-in-out infinite alternate;
  }
  @keyframes micro-float {
    from { transform: translateX(-50%) translateY(0); }
    to { transform: translateX(-50%) translateY(-7px); }
  }

  /* ============ 第六镜：航路尽头的白光 ============ */
  .path-light {
    position: fixed;
    left: 95%;
    top: 30%;
    z-index: 8;
    pointer-events: none;
    width: clamp(190px, 30vw, 430px);
    height: clamp(190px, 30vw, 430px);
    transform: translate(-50%, -50%) scale(0.7);
    background: radial-gradient(circle, rgba(255, 255, 255, 0.5), rgba(220, 235, 255, 0.2) 32%, rgba(160, 195, 255, 0.06) 58%, transparent 72%);
    opacity: 0;
    transition: opacity 3s ease, transform 4.5s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .path-light.on {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: light-pulse 5.5s ease-in-out infinite;
  }
  @keyframes light-pulse {
    0%, 100% { filter: brightness(0.92); }
    50% { filter: brightness(1.14); }
  }

  /* ============ 画面柔和提亮 ============ */
  .glow {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: radial-gradient(ellipse 90% 60% at 65% 30%, rgba(140, 170, 255, 0.09), transparent 65%);
    opacity: 0;
    transition: opacity 3s ease;
    pointer-events: none;
  }
  .glow.on { opacity: 1; }

  /* ============ 顶层：诗意台词逐行淡入 ============ */
  .stage {
    position: relative;
    z-index: 10;
    width: min(720px, calc(100vw - 48px - clamp(24px, 12vw, 180px)));
    margin-top: auto;
    margin-bottom: auto;
    margin-left: clamp(24px, 12vw, 180px);
    height: 58vh;
    min-height: 360px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
  }

  .track {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .line {
    opacity: 0;
    transition: opacity 0.45s ease, text-shadow 0.45s ease;
    padding: 0;
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    line-height: 2.1;
    letter-spacing: 0.1em;
    text-align: left;
    color: var(--text-main);
  }
  .line.v-first { padding-top: 0.95em; }
  .line.v-last { padding-bottom: 0.95em; }
  .line.active {
    opacity: 1;
    text-shadow: 0 0 28px rgba(160, 185, 255, 0.45);
  }
  .line.done { opacity: 1; color: var(--text-dim); }
  .line.big { font-size: clamp(1.6rem, 4.5vw, 2.1rem); }
  .line.gold { color: var(--gold); }
  .line.gold.active { text-shadow: 0 0 28px rgba(255, 217, 138, 0.4); }

  /* ============ 末尾唯一按钮：末句定格后淡入 ============ */
  .enter {
    position: fixed;
    z-index: 20;
    left: clamp(24px, 12vw, 180px);
    bottom: clamp(40px, 12vh, 110px);
    padding: 0.85em 2.6em;
    font: inherit;
    font-size: clamp(0.95rem, 2.2vw, 1.05rem);
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: var(--text-main);
    background: rgba(140, 170, 255, 0.04);
    border: 1px solid rgba(232, 236, 255, 0.32);
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    animation: breathe 3.6s ease-in-out infinite;
    transition:
      opacity 1.6s ease,
      transform 1.6s ease,
      color 0.6s ease,
      border-color 0.6s ease,
      box-shadow 0.6s ease;
  }
  .enter.on { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .enter:active { transform: translateY(0) scale(0.97); }
  .enter:hover, .enter:focus-visible {
    animation: none;
    color: var(--gold);
    border-color: rgba(255, 217, 138, 0.55);
    box-shadow: 0 0 24px rgba(255, 217, 138, 0.18), 0 0 60px rgba(150, 180, 255, 0.12);
    outline: none;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 rgba(160, 185, 255, 0); }
    50% { box-shadow: 0 0 22px rgba(160, 185, 255, 0.14); }
  }

  @media (max-width: 640px) {
    .main-star { width: 3px; height: 3px; }
    .enter { padding: 0.8em 2.1em; }
    .campus.on { opacity: 0.6; }
    /* 竖屏：台词下移，把上半屏让给星弧与光膜 */
    .stage { height: 44vh; min-height: 260px; margin-bottom: 12vh; }
    .membrane { left: 70%; top: 36%; width: clamp(170px, 48vw, 300px); height: clamp(170px, 48vw, 300px); }
    .path-light { left: 88%; top: 30%; }
  }
</style>
</head>
<body>
  <div class="nebula" id="nebula"></div>
  <div class="stars" id="stars"></div>

  <!-- 第一镜 / 第二镜：校园夜景 -->
  <div class="campus" id="campus">
    <div class="campus-inner">
      <div class="ground"></div>
      <div class="school">
        <div class="win-grid"></div>
        <div class="win-lit" id="winLit"><i></i><i></i><i></i></div>
      </div>
      <div class="lamp-group" id="lampGroup">
        <div class="lamp-pool"></div>
        <div class="lamp"></div>
      </div>
      <svg class="tree tree-a" viewBox="0 0 100 140" aria-hidden="true">
        <path d="M50 4 C68 10 84 28 82 50 C90 60 86 78 72 84 C74 96 62 104 50 100 C38 106 24 96 26 84 C12 78 10 58 20 48 C18 28 34 10 50 4 Z" fill="#030711"/>
        <path d="M47 96 h6 v42 h-6 z" fill="#030711"/>
      </svg>
      <svg class="tree tree-b" viewBox="0 0 100 140" aria-hidden="true">

  (function () {

    var verseData = [

    var $ = function (id) { return document.getElementById(id); };

    // ---------- 底层星云 ----------

    // ---------- 中层呼吸星点 ----------
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 55; i++) {
      var st = document.createElement('i');
      st.className = 'star';

    starsBox.appendChild(frag);

    // ---------- 第二镜：窗上滑落的雨滴 ----------
    var dropFrag = document.createDocumentFragment();
    for (var d = 0; d < 11; d++) {
      var dp = document.createElement('i');
      dp.className = 'drop';
      dp.style.left = (4 + Math.random() * 92).toFixed(1) + '%';
      dp.style.top = '0';
      dp.style.height = (12 + Math.random() * 16).toFixed(0) + 'px';
      dp.style.setProperty('--dur', (9 + Math.random() * 7).toFixed(1) + 's');
      dp.style.setProperty('--delay', (-Math.random() * 16).toFixed(1) + 's');
      dropFrag.appendChild(dp);
    }
    dropsBox.appendChild(dropFrag);

    // ---------- 八颗主星：弧形星轨（自左向右展开，通往第六镜的白光） ----------
    var mainStarPos = [
      { x: 46, y: 20 }, { x: 52, y: 13.5 }, { x: 60, y: 8.5 }, { x: 69, y: 5.8 },
      { x: 78, y: 6.8 }, { x: 85, y: 10.5 }, { x: 90, y: 16 }, { x: 93.2, y: 23.5 }
    ];
    var mainStarEls = mainStarPos.map(function (p, i) {
      var el = document.createElement('i');
      el.className = 'main-star';
      el.style.left = p.x + '%';
      el.style.top = p.y + '%';
      el.style.animationDelay = (-i * 0.28).toFixed(2) + 's';
      mainStarsBox.appendChild(el);
      return el;
    });

    // 星轨路径：穿过八星（Catmull-Rom → 三次贝塞尔）
    var trailLen = 0;
    var litCount = 0;
    function buildTrailPath() {
      var W = window.innerWidth, H = window.innerHeight;
      var pts = mainStarPos.map(function (p) { return { x: p.x / 100 * W, y: p.y / 100 * H }; });
      var d = 'M' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
      for (var i = 0; i < pts.length - 1; i++) {
        var p0 = pts[i - 1] || pts[i];
        var p1 = pts[i];
        var p2 = pts[i + 1];
        var p3 = pts[i + 2] || pts[i + 1];
        var c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
        var c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
        d += ' C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
      }
      trailBase.setAttribute('d', d);
      trailFlow.setAttribute('d', d);
      trailLen = trailBase.getTotalLength();
      trailBase.style.strokeDasharray = trailLen.toFixed(1);
      trailFlow.style.strokeDasharray = '46 ' + Math.ceil(trailLen);
      trailFlow.style.setProperty('--dash', Math.ceil(trailLen + 46) + 'px');
      setTrailProgress(litCount, true);
    }
    function setTrailProgress(n, instant) {
      litCount = n;
      var frac = mainStarEls.length > 1 ? Math.max(0, (n - 1) / (mainStarEls.length - 1)) : 0;
      trailBase.style.transition = instant
        ? 'none'
        : 'stroke-dashoffset 1.1s cubic-bezier(0.3, 0.7, 0.3, 1), stroke 3s ease';
      trailBase.style.strokeDashoffset = (trailLen * (1 - frac)).toFixed(1);
    }
    buildTrailPath();

    // ---------- 第三镜：玻璃碎裂（canvas） ----------
    var Shatter = (function () {
      var cv = $('shatter');
      var ctx = cv.getContext('2d');
      var W = 0, H = 0, DPR = 1;
      var raf = null, t0 = 0, last = 0, running = false, burst = false;
      var cracks = [], shards = [];
      var origin = { x: 0, y: 0 };
      var onBurstCb = null;
      var CRACK_MS = 1500, BURST_MS = 3000, TOTAL_MS = 6000;

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
        cv.style.width = W + 'px';
        cv.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function crackOrigin() {
        var el = winLit;
        if (el) {
          var r = el.getBoundingClientRect();
          if (r.width > 1) return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }
        return { x: W * 0.72, y: H * 0.6 };
      }

      function makeCracks() {
        cracks = [];
        var n = 3 + (Math.random() < 0.5 ? 1 : 0);
        for (var c = 0; c < n; c++) {
          var a = (Math.PI * 2 * c) / n + Math.random() * 1.1 - 0.55;
          var x = origin.x, y = origin.y;
          var pts = [{ x: x, y: y }];
          var segs = 9 + (Math.random() * 5 | 0);
          for (var i = 0; i < segs; i++) {
            a += (Math.random() - 0.5) * 0.85;   // 随机游走 → 星轨般弯折
            var len = 16 + Math.random() * 30;
            x += Math.cos(a) * len;
            y += Math.sin(a) * len;
            pts.push({ x: x, y: y });
            if (i > 2 && Math.random() < 0.28) { // 分叉
              var ba = a + (Math.random() < 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.6);
              var bx = x, by = y;
              var bp = [{ x: bx, y: by }];
              var bsegs = 3 + (Math.random() * 3 | 0);
              for (var j = 0; j < bsegs; j++) {
                ba += (Math.random() - 0.5) * 0.7;
                var bl = 10 + Math.random() * 22;
                bx += Math.cos(ba) * bl;
                by += Math.sin(ba) * bl;
                bp.push({ x: bx, y: by });
              }
              cracks.push({ pts: bp, w: 0.8, glow: 0.5, delay: 0.25 + Math.random() * 0.5, grow: 0.6 });
            }
          }
          cracks.push({ pts: pts, w: 1.4, glow: 1, delay: 0, grow: 1 });
        }
      }

      function spawnShards() {
        shards = [];
        var count = Math.round(Math.min(220, (W * H) / 9000));
        for (var i = 0; i < count; i++) {
          var ang = Math.random() * Math.PI * 2;
          var rad = Math.pow(Math.random(), 0.65) * Math.max(W, H) * 0.42;
          var x = origin.x + Math.cos(ang) * rad * 1.15;
          var y = origin.y + Math.sin(ang) * rad * 0.85 + 20;
          if (x < W * 0.18) x = W * 0.18 + Math.random() * W * 0.12;
          shards.push({
            x: x, y: y,
            vx: (x - origin.x) * 0.1 + (Math.random() - 0.5) * 30 + 10,
            vy: (y - origin.y) * 0.09 + (Math.random() - 0.5) * 30 + 28,
            size: 4 + Math.random() * 18,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.08,
            warm: Math.random() < 0.34,
            alpha: 0.55 + Math.random() * 0.45,
            decay: 0.16 + Math.random() * 0.22,
            dust: Math.random() < 0.3
          });
        }
      }

      function drawCracks(t, fade) {
        if (fade <= 0) return;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (var i = 0; i < cracks.length; i++) {
          var c = cracks[i];
          var start = (c.delay || 0) * 1000;
          var dur = CRACK_MS * 0.9 * (c.grow || 1);
          var p = (t - start) / dur;
          if (p <= 0) continue;
          if (p > 1) p = 1;
          var pts = c.pts;
          var total = pts.length - 1;
          var drawn = p * total;
          var full = Math.floor(drawn);
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (var j = 1; j <= full && j < pts.length; j++) ctx.lineTo(pts[j].x, pts[j].y);
          if (full < total) {
            var f = drawn - full;
            var a1 = pts[full], b1 = pts[full + 1];
            ctx.lineTo(a1.x + (b1.x - a1.x) * f, a1.y + (b1.y - a1.y) * f);
          }
          ctx.strokeStyle = 'rgba(170, 205, 255, ' + (0.1 * c.glow * fade).toFixed(3) + ')';
          ctx.lineWidth = c.w * 4.2;
          ctx.stroke();
          ctx.strokeStyle = 'rgba(226, 238, 255, ' + (0.55 * c.glow * fade).toFixed(3) + ')';
          ctx.lineWidth = c.w;
          ctx.stroke();
        }
      }

      function drawBurst(bt, dt) {
        // 碎裂白闪
        if (bt < 430) {
          var ft = bt / 430;
          var R = 70 + ft * Math.max(W, H) * 0.55;
          var fa = (1 - ft) * 0.45;
          var g = ctx.createRadialGradient(origin.x, origin.y, 0, origin.x, origin.y, R);
          g.addColorStop(0, 'rgba(238, 246, 255, ' + fa.toFixed(3) + ')');
          g.addColorStop(0.45, 'rgba(186, 212, 255, ' + (fa * 0.4).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(160, 190, 255, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }
        // 镜头随碎片下坠：缓慢推近 + 整体上移
        ctx.save();
        var zoom = 1 + Math.min(bt, BURST_MS) / BURST_MS * 0.26;
        var rise = Math.min(bt, BURST_MS) * 0.028;
        ctx.translate(origin.x, origin.y - rise);
        ctx.scale(zoom, zoom);
        ctx.translate(-origin.x, -origin.y);
        for (var i = 0; i < shards.length; i++) {
          var s = shards[i];
          if (s.alpha <= 0) continue;
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.rot += s.vr * dt;
          s.alpha -= s.decay * dt;
          var a = Math.max(0, s.alpha);
          var col = s.warm ? '255, 214, 150' : '168, 198, 255';
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          if (s.dust) {
            ctx.fillStyle = 'rgba(' + col + ', ' + (a * 0.7).toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(0.7, s.size * 0.12), 0, 6.283);
            ctx.fill();
          } else {
            var hgt = s.size * (0.75 + 0.25 * a);
            ctx.fillStyle = 'rgba(' + col + ', ' + (a * 0.85).toFixed(3) + ')';
            ctx.beginPath();
            ctx.moveTo(-s.size * 0.5, -hgt * 0.5);
            ctx.lineTo(s.size * 0.55, -hgt * 0.28);
            ctx.lineTo(s.size * 0.3, hgt * 0.5);
            ctx.lineTo(-s.size * 0.42, hgt * 0.36);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (a * 0.5).toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(0.8, s.size * 0.12), 0, 6.283);
            ctx.fill();
          }
          ctx.restore();
        }
        ctx.restore();
      }

      function frame(now) {
        if (!running) return;
        var t = now - t0;
        var dt = Math.min(40, now - (last || now)) / 1000;
        last = now;
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        if (t < CRACK_MS) {
          drawCracks(t, 1);
        } else {
          if (!burst) {
            burst = true;
            spawnShards();
            if (onBurstCb) onBurstCb();
          }
          drawCracks(t, Math.max(0, 1 - (t - CRACK_MS) / 380));
          drawBurst(t - CRACK_MS, dt);
        }
        if (t < TOTAL_MS) {
          raf = requestAnimationFrame(frame);
        } else {
          finish();
        }
      }

      function finish() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        ctx.clearRect(0, 0, W, H);
      }

      function start(cb) {
        resize();
        origin = crackOrigin();
        makeCracks();
        shards = [];
        burst = false;
        onBurstCb = cb || null;
        t0 = performance.now();
        last = 0;
        running = true;
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }

      function reset() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        shards = [];
        cracks = [];
        if (W && H) ctx.clearRect(0, 0, W, H);
      }

      resize();
      return { start: start, reset: reset, resize: resize };
    })();

    // ---------- 声音：WebAudio 程序化合成（无外部素材） ----------
    var Score = (function () {
      var ctx = null, master = null, noiseBuf = null;
      var vo = {};
      var scene = 'campus';
      var unlocked = false;

      // 程序化音效与氛围层（各镜一套增益，见 LEVELS）
      var LEVELS = {
        campus:   { f: 3.0, rumble: 0,     wind: 0,     shimmer: 0 },
        storm:    { f: 2.6, rumble: 0.10,  wind: 0.055, shimmer: 0 },
        shatter:  { f: 1.2, rumble: 0.17,  wind: 0.12,  shimmer: 0 },
        stars:    { f: 2.6, rumble: 0.015, wind: 0.025, shimmer: 0.008 },
        membrane: { f: 2.6, rumble: 0,     wind: 0.012, shimmer: 0.038 },
        finale:   { f: 3.4, rumble: 0,     wind: 0.005, shimmer: 0.022 }
      };
      var CHIME_SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];

      function lfo(rate, depth, param) {
        var o = ctx.createOscillator();
        o.frequency.value = rate;
        var g = ctx.createGain();
        g.gain.value = depth;
        o.connect(g);
        g.connect(param);
        o.start();
      }

      function ramp(param, v, sec) {
        var t = ctx.currentTime;
        var cur = Math.max(0, param.value);
        param.cancelScheduledValues(t);
        param.setValueAtTime(cur, t);
        param.linearRampToValueAtTime(v, t + sec);
      }

      function build() {
        master = ctx.createGain();
        master.gain.value = 0;
        var comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.knee.value = 24;
        comp.ratio.value = 6;
        comp.attack.value = 0.006;
        comp.release.value = 0.3;
        master.connect(comp);
        comp.connect(ctx.destination);

        // 低频轰鸣
        var rumbleG = ctx.createGain();
        rumbleG.gain.value = 0;
        var rumbleTrem = ctx.createGain();
        rumbleTrem.gain.value = 0.75;
        lfo(0.09, 0.22, rumbleTrem.gain);
        rumbleG.connect(rumbleTrem);
        rumbleTrem.connect(master);
        [43, 38.2].forEach(function (f) {
          var o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.value = f;
          var g = ctx.createGain();
          g.gain.value = 0.5;
          o.connect(g);
          g.connect(rumbleG);
          o.start();
        });
        vo.rumble = rumbleG;

        // 风声
        var noise = ctx.createBufferSource();
        noise.buffer = noiseBuf;
        noise.loop = true;
        var windF = ctx.createBiquadFilter();
        windF.type = 'bandpass';
        windF.frequency.value = 640;
        windF.Q.value = 0.6;
        var windG = ctx.createGain();
        windG.gain.value = 0;
        noise.connect(windF);
        windF.connect(windG);
        windG.connect(master);
        lfo(0.07, 240, windF.frequency);
        noise.start();
        vo.wind = windG;

        // 镜五：空气感微光
        var air = ctx.createBufferSource();
        air.buffer = noiseBuf;
        air.loop = true;
        var airHi = ctx.createBiquadFilter();
        airHi.type = 'highpass';
        airHi.frequency.value = 2600;
        var airLo = ctx.createBiquadFilter();
        airLo.type = 'lowpass';
        airLo.frequency.value = 7200;
        var airG = ctx.createGain();
        airG.gain.value = 0;
        air.connect(airHi);
        airHi.connect(airLo);
        airLo.connect(airG);
        airG.connect(master);
        lfo(0.05, 900, airLo.frequency);
        air.start();
        vo.shimmer = airG;
      }

      function noiseHit(opt) {
        if (!ctx || !unlocked) return;
        var t = ctx.currentTime + (opt.delay || 0.01);
        var s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        var f = ctx.createBiquadFilter();
        f.type = opt.type || 'bandpass';
        f.frequency.value = opt.freq || 1000;
        f.Q.value = opt.q || 1;
        var g = ctx.createGain();
        var peak = opt.peak || 0.1;
        var dur = opt.dur || 0.12;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.02, dur * 0.3));
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f);
        f.connect(g);
        g.connect(master);
        s.start(t, Math.random() * 0.9);
        s.stop(t + dur + 0.05);
      }

      function apply(name, fade) {
        if (!ctx) return;
        var L = LEVELS[name] || LEVELS.campus;
        var f = fade || L.f || 2.6;
        ramp(vo.rumble.gain, L.rumble || 0, f);
        ramp(vo.wind.gain, L.wind || 0, f);
        ramp(vo.shimmer.gain, L.shimmer || 0, f);
      }

      function unlock() {
        if (!ctx) {
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            ctx = new AC();
            var len = Math.floor(ctx.sampleRate * 2);
            noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
            var data = noiseBuf.getChannelData(0);
            for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            build();
          } catch (e) { ctx = null; return; }
        }
        if (ctx.state === 'suspended') ctx.resume();
        if (!unlocked) {
          unlocked = true;
          ramp(master.gain, 0.6, 2.5);
          apply(scene, 3);
        }
      }

      function chime(i) {
        if (!ctx || !unlocked) return;
        var t = ctx.currentTime + 0.02;
        var f0 = CHIME_SCALE[i % CHIME_SCALE.length];
        var out = ctx.createGain();
        out.gain.value = 0.085;
        out.connect(master);
        [[1, 1, 1.6], [2.76, 0.32, 0.9], [5.4, 0.14, 0.55]].forEach(function (p) {
          var o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.value = f0 * p[0];
          var g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(p[1], t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
          o.connect(g);
          g.connect(out);
          o.start(t);
          o.stop(t + p[2] + 0.05);
        });
      }

      function crackles() {
        for (var i = 0; i < 14; i++) {
          noiseHit({
            delay: 0.08 + Math.random() * 1.3,
            freq: 1500 + Math.random() * 1900,
            q: 1.4,
            peak: 0.022 + Math.random() * 0.02,
            dur: 0.05 + Math.random() * 0.06
          });
        }
      }

      function boom() {
        if (!ctx || !unlocked) return;
        var t = ctx.currentTime + 0.01;
        var o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(64, t);
        o.frequency.exponentialRampToValueAtTime(26, t + 1.9);
        var g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.26, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + 2.2);
        noiseHit({ delay: 0.01, type: 'lowpass', freq: 180, q: 0.8, peak: 0.14, dur: 0.9 });
      }

      document.addEventListener('pointerdown', unlock);
      document.addEventListener('keydown', unlock);

      return {
        scene: function (name) { scene = name; apply(name); },
        chime: chime,
        crackles: crackles,
        boom: boom
      };
    })();

    // ---------- 情绪转场 ----------
    function setStarsOpacity(v, dur) {
      starsBox.style.transitionDuration = dur + 'ms';
      starsBox.style.opacity = v;
    }
    function veilTo(lv) {
      veil.classList.remove('lv2', 'lv3', 'lv4', 'lv5');
      if (lv) veil.classList.add(lv);
    }
    function moodMainStars() {                                // 第四镜：八星缓缓定点亮起
      setStarsOpacity(0.55, 2500);
      mainStarEls.forEach(function (el, i) {
        setTimeout(function () {
          el.classList.add('lit');
          Score.chime(i);
          setTrailProgress(i + 1);
          if (i === 0) trailSvg.classList.add('lit');
        }, i * 350);
      });
    }
    function moodFinal() {                                    // 第六镜：八星共振，克制提亮
      setStarsOpacity(0.72, 3000);
      glow.classList.add('on');
      mainStarsBox.classList.add('resonate');
    }

    // ---------- 六镜切换 ----------
    var Cues = {
      campus: function () {                                   // 第一镜：岁月静好
        blackout.classList.add('lift');
        campus.classList.add('on', 'push');
        Score.scene('campus');
      },
      storm: function () {                                    // 第二镜：风雨潜行
        campus.classList.add('storm');
        veilTo('lv2');
        rainBox.classList.add('on');
        setTimeout(function () { winLit.classList.add('out'); }, 420);
        setTimeout(function () { lampGroup.classList.add('dying'); }, 1250);
        setTimeout(function () { lampGroup.classList.add('out'); }, 2400);
        setStarsOpacity(0.3, 900);
        Score.scene('storm');
      },
      shatter: function () {                                  // 第三镜：星海陷落（空镜）
        veilTo('lv3');
        setStarsOpacity(0.06, 2400);
        campus.classList.add('gone');
        rainBox.classList.remove('on');
        Score.scene('shatter');
        Score.crackles();
        Shatter.start(function () { Score.boom(); });
      },
      stars: function () {                                    // 第四镜：八星升起
        veilTo('lv4');
        Shatter.reset();                                      // 兜底：空镜结束后画布必定清空
        moodMainStars();
        Score.scene('stars');
      },
      membrane: function () {                                 // 第五镜：安全铠甲
        veilTo('lv5');
        membrane.classList.add('on');
        Score.scene('membrane');
      },
      finale: function () {                                   // 第六镜：星途已启
        veilTo('');
        trailSvg.classList.add('lit');
        pathLight.classList.add('on');
        sky.classList.add('advance');
        moodFinal();
        Score.scene('finale');
      }
    };

    // ---------- 渲染台词 ----------
    var lineEls = lines.map(function (item) {
      var el = document.createElement('p');
      el.className = 'line';
      if (item.big) el.classList.add('big');
      if (item.gold) el.classList.add('gold');
      if (item.firstInVerse) el.classList.add('v-first');
      if (item.lastInVerse) el.classList.add('v-last');
      el.textContent = item.text;
      track.appendChild(el);
      return el;
    });

    var tops = [];
    var heights = [];
    var stageH = 0;

    function measure() {
      stageH = stage.clientHeight;
      tops = lineEls.map(function (el) { return el.offsetTop; });
      heights = lineEls.map(function (el) { return el.offsetHeight; });
    }
    measure();

    var timers = [];
    var cur = -1;

    function scrollToLine(i) {
      var ty = stageH / 2 - (tops[i] + heights[i] / 2);
      track.style.transform = 'translateY(' + ty + 'px)';
    }

    function holdMs(item) {
      return item.hold || HOLD;
    }

    function step() {
      cur++;
      if (cur >= lineEls.length) { settle(); return; } // 播完定格，随后淡入唯一按钮

      if (cur > 0 && lineEls[cur - 1].classList.contains('active')) {
        lineEls[cur - 1].classList.remove('active');
        lineEls[cur - 1].classList.add('done');
      }
      lineEls[cur].classList.add('active');
      scrollToLine(cur);

      if (cur === 3) Cues.storm();
      if (cur === 5) Cues.stars();
      if (cur === 7) Cues.membrane();
      if (cur === 11) Cues.finale();

      var wait = holdMs(lines[cur]);
      if (cur === 4) {
        // 第三镜：台词先散尽，空镜六秒后八星升起
        timers.push(setTimeout(function () {
          lineEls.forEach(function (el) { el.classList.remove('active', 'done'); });
          Cues.shatter();
        }, wait));
        wait += INTERLUDE;
      }
      timers.push(setTimeout(step, wait));
    }

    function settle() {   // 末句定格，稍作留白后淡入“开启探索”
      timers.push(setTimeout(function () { enterBtn.classList.add('on'); }, ENTER_DELAY));
    }

    function play() {
      timers.forEach(clearTimeout);
      timers = [];
      lineEls.forEach(function (el) { el.classList.remove('active', 'done'); });
      mainStarEls.forEach(function (el) { el.classList.remove('lit'); });
      mainStarsBox.classList.remove('resonate');
      trailSvg.classList.remove('lit');
      glow.classList.remove('on');
      enterBtn.classList.remove('on');
      campus.classList.remove('on', 'push', 'storm', 'gone');
      lampGroup.classList.remove('dying', 'out');
      winLit.classList.remove('out');
      rainBox.classList.remove('on');
      veilTo('');
      membrane.classList.remove('on');
      pathLight.classList.remove('on');
      sky.classList.remove('advance');
      Shatter.reset();
      setTrailProgress(0, true);
      cur = -1;

      // 第一镜：星海舒展，星光轻轻亮起
      setStarsOpacity(0.7, 4000);

      // 第一句从对齐点下方 56px 起步，滑入中央
      var ty0 = stageH / 2 - (tops[0] + heights[0] / 2) + 56;
      track.style.transition = 'none';
      track.style.transform = 'translateY(' + ty0 + 'px)';
      void track.offsetHeight;
      track.style.transition = '';

      step();
      // 等一帧，确保黑场过渡生效
      setTimeout(function () { Cues.campus(); }, 80);
    }

    window.addEventListener('resize', function () {
      measure();
      buildTrailPath();
      Shatter.resize();
      if (cur >= 0) {
        track.style.transition = 'none';
        scrollToLine(cur);
        void track.offsetHeight;
        track.style.transition = '';
      }
    });

    var STORAGE_KEY = 'prequel-seen';

    function readSeen() {
      try { return sessionStorage.getItem(STORAGE_KEY) === '1'; } catch (e) { return false; }
    }

    function markSeen() {
      try { sessionStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
    }

    function freezeFinal() {   // 本次会话已看过：不重播，直接定格末屏
      cur = lineEls.length - 1;
      lineEls.forEach(function (el) { el.classList.remove('active'); el.classList.add('done'); });
      lineEls[cur].classList.remove('done');
      lineEls[cur].classList.add('active');
      track.style.transition = 'none';
      scrollToLine(cur);
      void track.offsetHeight;
      track.style.transition = '';
      blackout.style.transition = 'none';
      blackout.classList.add('lift');
      setStarsOpacity(0.72, 0);
      glow.classList.add('on');
      mainStarEls.forEach(function (el) { el.classList.add('lit'); });
      setTrailProgress(mainStarEls.length, true);
      trailSvg.classList.add('lit');
      membrane.classList.add('on');
      pathLight.classList.add('on');
      sky.classList.add('advance');
      mainStarsBox.classList.add('resonate');
      enterBtn.classList.add('on');
      Score.scene('finale');
    }

    enterBtn.addEventListener('click', function () {
      markSeen();
      if (NEXT_URL) location.href = NEXT_URL;
    });

    if (readSeen()) { freezeFinal(); } else { play(); }
  })();
  </script>
</body>
</html>
